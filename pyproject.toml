[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knownbad"
version = "0.1.0"
description = "Negative controls for evals: how many wrong answers does your grader accept?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["evals", "llm", "llm-as-judge", "grader", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3.100"]

[project.scripts]
knownbad = "knownbad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "inspect-ai>=0.3.100"]

[tool.hatch.build.targets.wheel]
packages = ["src/knownbad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The report embeds its stylesheet and script as strings.
"src/knownbad/report/html.py" = ["E501"]
# Quoted judge prompts keep their original line lengths.
"study/judges/*.py" = ["E501"]
