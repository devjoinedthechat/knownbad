name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest pytest-cov hypothesis mypy ruff
      - name: Inspect AI, for the adapter tests
        if: matrix.python != '3.10'
        run: python -m pip install -e ".[inspect]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests
        if: matrix.python == '3.10'
        run: pytest -q
      - name: Tests with the coverage floor
        if: matrix.python != '3.10'
        run: pytest -q --cov
      - name: The example gates as documented
        shell: bash
        run: |
          knownbad run examples/support/items.jsonl --grader examples/support/graders.py:careful --max-leak 0
          ! knownbad run examples/support/items.jsonl --grader examples/support/graders.py:loose --max-leak 0.05 -q
          knownbad run examples/agent/items.jsonl --grader examples/agent/graders.py:reads_the_calls --max-leak 0
          ! knownbad run examples/agent/items.jsonl --grader examples/agent/graders.py:reads_the_reply --max-leak 0.05 -q

  action:
    # The GitHub Action in this repository, used the way the README shows it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A sound grader passes the gate
        uses: ./
        with:
          items: examples/support/items.jsonl
          grader: examples/support/graders.py:careful
          max-leak: "0"
          report: careful.html
          result: careful.json
      - name: The report and the result were written
        shell: bash
        run: test -s careful.html && test -s careful.json
      - name: A loose grader fails it
        id: loose
        continue-on-error: true
        uses: ./
        with:
          items: examples/support/items.jsonl
          grader: examples/support/graders.py:loose
          max-leak: "0.05"
          report: loose.html
          result: loose.json
      - name: A worse grader fails against a baseline
        id: baseline
        continue-on-error: true
        uses: ./
        with:
          items: examples/support/items.jsonl
          grader: examples/support/graders.py:loose
          baseline: careful.json
          report: against.html
          result: against.json
      - name: Both failures were reported as failures
        shell: bash
        run: |
          test "${{ steps.loose.outcome }}" = failure
          test "${{ steps.baseline.outcome }}" = failure
